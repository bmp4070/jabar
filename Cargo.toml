[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
paths = { path = "crates/paths" }
vfs = { path = "crates/vfs" }
build-model = { path = "crates/build-model" }
telemetry = { path = "crates/telemetry" }

anyhow = "1.0.102"
camino = "1.2.2"
crossbeam-channel = "0.5.15"
indexmap = "2.14.0"
lsp-server = "0.7.9"
lsp-types = "=0.95.0"
rustc-hash = "2.1.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"

[profile.dev]
debug = 1
