name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Match tag to Cargo version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "${GITHUB_REF_NAME}" = "v${version}"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-13
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build locked release binary
        run: cargo build --release --locked --package jabar-server --bin jabar --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          artifact="jabar-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          stage=$(mktemp -d)
          install -m 0755 "target/${{ matrix.target }}/release/jabar" "${stage}/jabar"
          install -m 0644 LICENSE NOTICE "${stage}/"
          tar -czf "${artifact}" -C "${stage}" jabar LICENSE NOTICE
          shasum -a 256 "${artifact}" > "${artifact}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: jabar-${{ matrix.target }}
          path: |
            jabar-*.tar.gz
            jabar-*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: jabar-*
          merge-multiple: true
      - name: Assemble checksums
        shell: bash
        run: cat ./*.sha256 | sort -k 2 > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.tar.gz SHA256SUMS --verify-tag --generate-notes
