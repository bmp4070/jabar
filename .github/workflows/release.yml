name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  quality:
    name: Validate release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: bazelbuild/setup-bazelisk@b39c379c82683a5f25d34f0d062761f62693e0b2 # v3
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-23
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Match tag to Cargo version
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          extension_version=$(node -p 'require("./editors/vscode/package.json").version')
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "$extension_version" = "$version"
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Prepare Bazel fixture
        working-directory: fixtures/megarepo
        run: bazel build //... --noshow_progress
      - name: Test
        run: cargo test --workspace --locked
      - name: Test installer
        run: scripts/test-install.sh
      - name: Install VS Code dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Test VS Code extension
        working-directory: editors/vscode
        run: npm test

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-23
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build locked release binary
        run: cargo build --release --locked --package jabar-server --bin jabar --target "${{ matrix.target }}"
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          artifact="jabar-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          stage=$(mktemp -d)
          install -m 0755 "target/${{ matrix.target }}/release/jabar" "${stage}/jabar"
          install -m 0644 LICENSE NOTICE "${stage}/"
          tar -czf "${artifact}" -C "${stage}" jabar LICENSE NOTICE
          shasum -a 256 "${artifact}" > "${artifact}.sha256"
          shasum -a 256 -c "${artifact}.sha256"
          mkdir verify
          tar -xzf "${artifact}" -C verify
          test "$(verify/jabar --version)" = "jabar ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jabar-${{ matrix.target }}
          path: |
            jabar-*.tar.gz
            jabar-*.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: jabar-*
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          targets=(
            x86_64-unknown-linux-gnu
            aarch64-unknown-linux-gnu
            x86_64-apple-darwin
            aarch64-apple-darwin
          )
          test "$(find . -maxdepth 1 -type f -name 'jabar-*.tar.gz' | wc -l | tr -d ' ')" = 4
          test "$(find . -maxdepth 1 -type f -name 'jabar-*.tar.gz.sha256' | wc -l | tr -d ' ')" = 4
          : > SHA256SUMS
          for target in "${targets[@]}"; do
            archive="jabar-${GITHUB_REF_NAME}-${target}.tar.gz"
            checksum="${archive}.sha256"
            test -f "$archive"
            test -f "$checksum"
            test "$(wc -l < "$checksum" | tr -d ' ')" = 1
            shasum -a 256 -c "$checksum"
            cat "$checksum" >> SHA256SUMS
          done
          sort -k 2 -o SHA256SUMS SHA256SUMS
          test "$(wc -l < SHA256SUMS | tr -d ' ')" = 4
          shasum -a 256 -c SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" ./*.tar.gz SHA256SUMS --verify-tag --generate-notes
